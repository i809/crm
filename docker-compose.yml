version: "3.8"
name: rubbertrack-platform

services:
  postgres:
    image: pgvector/pgvector:pg17
    ports: ["5432:5432"]
    environment: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: rubbertrack}
    volumes: [pgdata:/var/lib/postgresql/data, ./infra/tenancy/helper.sql:/docker-entrypoint-initdb.d/01_helper.sql:ro, ./infra/tenancy/schema.sql:/docker-entrypoint-initdb.d/02_schema.sql:ro]

  directus:
    image: directus/directus:latest
    ports: ["8055:8055"]
    environment: {KEY: k, SECRET: s, ADMIN_EMAIL: admin@example.com, ADMIN_PASSWORD: admin1234, DB_CLIENT: pg, DB_HOST: postgres, DB_PORT: 5432, DB_DATABASE: rubbertrack, DB_USER: postgres, DB_PASSWORD: postgres, PUBLIC_URL: http://localhost:8055}
    depends_on: [postgres]

  bff:
    build: {context: ./apps/bff}
    ports: ["4000:4000"]
    environment: {BFF_PORT: "4000", DIRECTUS_URL: http://directus:8055, AI_SERVICE_URL: http://ai-service:5000, PG_HOST: postgres, PG_DATABASE: rubbertrack, PG_USER: app_role, PG_PASSWORD: apppass, PG_ADMIN_USER: postgres, PG_ADMIN_PASSWORD: postgres}
    volumes: [./preview:/app/preview:ro]
    depends_on: [directus, ai-service]

  ai-service:
    build: {context: ./apps/ai}
    ports: ["5000:5000"]
    environment:
      AI_PORT: "5000"
      AI_PROVIDER: openrouter
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: "google/gemma-4-26b-a4b-it:free"
      PG_HOST: postgres
      PG_DATABASE: rubbertrack
      PG_USER: app_role
      PG_PASSWORD: apppass
    depends_on: [postgres]

  web:
    build: {context: ./apps/web}
    ports: ["3000:3000"]
    environment: {NEXT_PUBLIC_BFF_URL: http://localhost:4000, NEXT_PUBLIC_DIRECTUS_URL: http://localhost:8055}
    depends_on: [bff]

volumes:
  pgdata:
